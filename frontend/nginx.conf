server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads (meter photos, payment proofs). nginx's default is 1 MB, which
    # rejects anything slightly over with a 413 before Django ever sees it.
    # Keep this >= IMAGE_UPLOAD_MAX_MB in the backend (default 15).
    client_max_body_size 15m;

    # ── Compression ──────────────────────────────────────────────────────
    # Newer nginx versions serve .js as text/javascript, older ones as
    # application/javascript — list both, otherwise the main bundle can go
    # out uncompressed (3-4x larger over the wire).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # ── PWA: these must never be cached, or phones keep running old code ──
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # Hashed build files can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Un-hashed static images (logos, icons): cache for a month.
    location ~* ^/(branding|icons)/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media/ {
        proxy_pass http://backend:8000;
    }
}