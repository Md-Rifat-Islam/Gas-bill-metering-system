server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads (meter photos, payment proofs). nginx's default is 1 MB, which
    # rejects anything slightly over with a 413 before Django ever sees it.
    # Keep this >= IMAGE_UPLOAD_MAX_MB in the backend (default 15).
    client_max_body_size 15m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media/ {
        proxy_pass http://backend:8000;
    }

    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
}